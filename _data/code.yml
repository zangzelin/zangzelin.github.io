# Selected open-source code / software projects maintained by Zelin Zang.
# Consumed by _includes/code.html (EN) and _includes/code-zh.html (ZH).
# Fields:
#   name        - repo / project short name
#   description - one-sentence English summary
#   description_zh - one-sentence Chinese summary
#   repo        - GitHub repository path (owner/repo)
