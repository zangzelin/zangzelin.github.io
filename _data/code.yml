- name: DiffAug
  description: >-
    Diffusion-based data augmentation that enhances unsupervised contrastive
    learning without domain knowledge.
  description_zh: >-
    基于扩散模型的数据增广方法，无需领域知识即可增强无监督对比学习。
  repo: zangzelin/code_diffaug
  year: 2024
  paper_link: /publication/2024-07-01-boosting-contrastive
  website: https://icml.cc/virtual/2024/poster/32932
  tags:
    - ICML 2024
    - DiffAug

